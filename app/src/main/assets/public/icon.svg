<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Glowing circle background -->
  <circle cx="256" cy="256" r="140" fill="#10b981" fill-opacity="0.15" filter="url(#glow)"/>

  <!-- Wallet / Money Card Icon -->
  <g transform="translate(106, 126)" fill="none" stroke="url(#emeraldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="40" width="260" height="180" rx="32"/>
    <line x1="20" y1="100" x2="280" y2="100"/>
    <circle cx="210" cy="150" r="14" fill="#34d399"/>
    <path d="M70 150h50" stroke="#10b981" stroke-width="16"/>
  </g>
</svg>
